<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImageHost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/frontend/style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">
    <span class="logo-dot"></span>
    ImageHost
  </div>
  <div class="header-search">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <div class="search-tags" id="searchTags"></div>
        <input class="search-input" id="searchInput" type="text" placeholder="输入标签后回车…">
        <div class="tag-suggest filter-tag-suggest" id="filterTagSuggest"></div>
      </div>
  </div>
  <div class="header-right">
    <!-- api help -->
    <button class="btn-icon" onclick="openApiHelp()" title="随机图片 API 说明">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    </button>
    <!-- theme toggle -->
    <button class="btn-icon" onclick="toggleTheme()" title="切换主题">
      <span class="icon-sun">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </span>
      <span class="icon-moon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </span>
    </button>
  </div>
</header>

<!-- TAG ROW -->
<div class="tagrow" id="tagrow">
  <div class="tagrow-top">
    <span class="tagrow-label">筛选</span>
    <button class="tag-mode-toggle" id="tagModeBtn" type="button" onclick="toggleTagClickMode()">包含</button>
    <div class="tag-strip-pills" id="tagStripPills">
      <div id="tagPills" class="tag-pills"></div>
    </div>
    <button class="tagrow-toggle" id="tagrowToggle" type="button" onclick="toggleTagBar()" title="展开所有标签" aria-expanded="false" aria-controls="tagPanel">
      <svg class="tgl-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </div>
  <div class="tag-panel" id="tagPanel"></div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="bar">
    <div class="bar-count" id="barCount">—</div>
    <div class="bar-actions">
      <div class="bulk-actions" id="bulkActions">
        <span class="bulk-count" id="bulkCount">已选 0</span>
        <button class="btn btn-bulk" onclick="batchCopyUrls()">复制 URL</button>
        <button class="btn btn-bulk" onclick="batchDownloadImages()">下载</button>
        <button class="btn btn-bulk" onclick="clearSelection()">取消</button>
      </div>
      <button class="btn" id="clearBtn" style="display:none;font-size:12px;height:28px;padding:0 10px" onclick="clearFilters()">
        清除筛选
      </button>
    </div>
  </div>
  <div class="masonry" id="gallery"></div>
  <div id="sentinel"></div>
  <div class="spinner" id="spinner">loading…</div>
  <div class="empty" id="emptyState" style="display:none">
    <div class="empty-icon">◻</div>
    <h3>暂无图片</h3>
    <p>去管理页面<a href="/admin" style="color:var(--c-text2);text-decoration:underline">上传一些图片</a>开始吧</p>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lb" id="lb" onclick="lbBgClick(event)">
  <button class="lb-nav lb-prev" onclick="lbNav(-1)">&#8249;</button>
  <button class="lb-nav lb-next" onclick="lbNav(1)">&#8250;</button>
  <button class="lb-close" onclick="closeLb()">✕</button>
  <div class="lb-caption" id="lbTitle"></div>
  <div class="lb-stage">
    <img class="lb-img" id="lbImg" src="" alt="">
  </div>
  <div class="lb-desc" id="lbDescription"></div>
  <div class="lb-tags" id="lbTags"></div>

  <!-- URL fallback panel -->
  <div class="url-panel" id="urlPanel">
    <div class="url-panel-title">手动复制链接</div>
    <div class="url-row">
      <span class="url-lbl">WebP</span>
      <input type="text" class="url-in" id="urlWebp" readonly onclick="this.select()">
      <button class="url-copy" onclick="manualCopy('urlWebp',this)">复制</button>
    </div>
    <div class="url-row">
      <span class="url-lbl">原图</span>
      <input type="text" class="url-in" id="urlOrig" readonly onclick="this.select()">
      <button class="url-copy" onclick="manualCopy('urlOrig',this)">复制</button>
    </div>
  </div>

  <div class="lb-bar">
    <button class="lbtn" id="lbCopyW" onclick="lbCopy('webp')">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      WebP 链接
    </button>
    <button class="lbtn" id="lbCopyO" onclick="lbCopy('orig')">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      原图链接
    </button>
    <button class="lbtn" onclick="triggerDl()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      下载原图
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- API HELP MODAL -->
<div class="backdrop" id="apiHelpBackdrop" onclick="if(event.target===this)closeApiHelp()">
  <div class="sheet">
    <div class="sheet-head">
      <div>
        <div class="sheet-title">随机图片 API</div>
        <div class="sheet-sub">通过 URL 直接获取随机图片，无需认证</div>
      </div>
      <button class="sheet-x" onclick="closeApiHelp()">✕</button>
    </div>
    <div class="sheet-body">
      <p class="doc-p">访问以下地址即可获得一张随机图片，可直接用于 <code>&lt;img&gt;</code> 标签。</p>
      <div class="doc-block">
        <div class="doc-title">基础用法</div>
        <code class="doc-code" id="apiUrl1"></code>
        <code class="doc-code" id="apiImg"></code>
      </div>
      <div class="doc-block">
        <div class="doc-title">常用参数</div>
        <table class="doc-table">
          <tr><td>tag</td><td>按单个标签过滤</td></tr>
          <tr><td>tags</td><td>多标签过滤，逗号分隔（AND）</td></tr>
          <tr><td>format</td><td>webp（默认）· original · json</td></tr>
          <tr><td>count</td><td>JSON 模式返回数量（1–50）</td></tr>
          <tr><td>exclude</td><td>排除的图片 ID，避免连续重复</td></tr>
        </table>
      </div>
      <div class="doc-block">
        <div class="doc-title">示例</div>
        <code class="doc-code" id="apiUrl2"></code>
        <code class="doc-code" id="apiUrl3"></code>
      </div>
      <p class="doc-p doc-note">每个 IP 每分钟有访问频率限制，超限返回 HTTP 429。</p>
    </div>
  </div>
</div>

<script>
/* ────────────────────────────────── STATE */
let page=1, PG=20, total=0, loading=false, done=false;
let activeTags=[], activeExcludeTags=[], q='', tagClickMode='include';
let allTags=[];
let imgs=[], lbIdx=0;
let selectedIds = new Set();
let lbW='', lbO='', lbFn='';
let tagExpanded=false;
let io=null, galleryRO=null, scrolledForMore=false, suppressScrollArm=false, loadSeq=0, layoutRAF=0;
const VIRTUAL_MAX = 100;
const VIRTUAL_BUFFER = 50;
let virtualPositions=[], renderedCards=new Map(), virtualRAF=0;

/* ────────────────────────────────── THEME */
function toggleTheme(){
  const t = document.documentElement.dataset.theme==='dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  localStorage.setItem('theme', t);
}
(function(){
  const s = localStorage.getItem('theme');
  if(s) document.documentElement.dataset.theme = s;
  else if(window.matchMedia('(prefers-color-scheme:light)').matches)
    document.documentElement.dataset.theme = 'light';
})();

/* ────────────────────────────────── INIT */
async function init(){
  applyUrlFilters();
  await loadTags();
  await loadImgs(true);
  setupIO();
  setupTagBarBehavior();
  window.addEventListener('resize', debounce(scheduleGalleryLayout, 120));
  if('ResizeObserver' in window){
    galleryRO = new ResizeObserver(()=>scheduleGalleryLayout());
    galleryRO.observe(document.getElementById('gallery'));
  }
  document.getElementById('searchInput').addEventListener('keydown', onSearchKey);
  document.getElementById('searchInput').addEventListener('input', ()=>renderTagSuggestions('filter'));
  document.getElementById('searchInput').addEventListener('focus', ()=>openTagSuggestions('filter'));
  window.addEventListener('popstate', ()=>{
    applyUrlFilters();
    loadImgs(true);
  });
  document.addEventListener('click', e=>{
    if(!e.target.closest('.search-box')) closeTagSuggestions('filter');
  });
  document.getElementById('lb').addEventListener('click', e=>{
    const p = document.getElementById('urlPanel');
    if(!p.contains(e.target) && !e.target.closest('.lbtn')) p.classList.remove('on');
  });
}

/* ────────────────────────────────── TAG BAR (collapsible) */
function renderTagPanel(){
  const panel=document.getElementById('tagPanel');
  const pills=document.getElementById('tagPills');
  if(!panel || !pills) return;
  panel.innerHTML='';
  const tags=pills.querySelectorAll('.tag');
  if(!tags.length) return;
  const wrap=document.createElement('div');
  wrap.className='tag-pills';
  const firstTop=tags[0].offsetTop;
  tags.forEach(el=>{
    if(el.offsetTop > firstTop + 4){
      const clone=el.cloneNode(true);
      clone.onclick=el.onclick;
      wrap.appendChild(clone);
    }
  });
  if(wrap.children.length) panel.appendChild(wrap);
}
function setTagExpanded(on){
  tagExpanded=on;
  const row=document.getElementById('tagrow');
  row.classList.toggle('expanded', on);
  const t=document.getElementById('tagrowToggle');
  if(t){
    t.title = on ? '收起标签' : '展开所有标签';
    t.setAttribute('aria-expanded', String(on));
  }
  const panel=document.getElementById('tagPanel');
  if(!panel) return;
  if(on){
    renderTagPanel();
    panel.classList.toggle('open', panel.children.length>0);
  }else{
    panel.classList.remove('open');
    panel.innerHTML='';
  }
}
function toggleTagBar(){
  setTagExpanded(!tagExpanded);
}
function setupTagBarBehavior(){
  document.addEventListener('click', e=>{
    if(tagExpanded && !e.target.closest('#tagrow')) setTagExpanded(false);
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape' && tagExpanded) setTagExpanded(false);
  });
  const gallery=document.getElementById('gallery');
  if(gallery){
    gallery.addEventListener('click', ()=>setTagExpanded(false));
    gallery.addEventListener('touchstart', ()=>setTagExpanded(false), {passive:true});
  }
  window.addEventListener('resize', debounce(()=>{
    if(tagExpanded) setTagExpanded(true);
  }, 150));
}

/* ────────────────────────────────── TAGS */
async function loadTags(){
  try{
    const d = await fetch('/api/tags').then(r=>r.json());
    allTags = d.tags||[];
    renderTags(allTags);
    renderTagSuggestions('filter');
    if(tagExpanded) setTagExpanded(true);
  }catch(e){}
}
function renderTags(tags){
  const c = document.getElementById('tagPills'); c.innerHTML='';
  const all = mktag('全部',null,activeTags.length===0 && activeExcludeTags.length===0);
  all.onclick = ()=>{ activeTags=[]; activeExcludeTags=[]; commitFilters(); };
  c.appendChild(all);
  tags.forEach(t=>{
    const el = mktag(t.name, t.count, activeTags.includes(t.name), activeExcludeTags.includes(t.name));
    el.onclick = ()=>toggleTag(t.name);
    c.appendChild(el);
  });
}
function tagSuggestConfig(ctx){
  if(ctx==='filter'){
    return {
      input: document.getElementById('searchInput'),
      menu: document.getElementById('filterTagSuggest'),
      selected: ()=>activeTags.concat(activeExcludeTags),
      add: addSearchTag,
    };
  }
  return null;
}
function normalizeTag(raw){ return String(raw||'').trim().replace(/,/g,''); }
function parseFilterTag(raw){
  let value=String(raw||'').trim().replace(/,/g,'');
  const exclude=value.startsWith('!');
  if(exclude) value=value.slice(1).trim();
  return {tag:value, exclude};
}
function suggestedTags(ctx){
  const cfg=tagSuggestConfig(ctx);
  if(!cfg.input) return [];
  const parsed = ctx==='filter' ? parseFilterTag(cfg.input.value) : null;
  const q=(parsed ? parsed.tag : cfg.input.value.trim()).toLowerCase();
  const selected=new Set(cfg.selected().map(t=>String(t).toLowerCase()));
  return allTags
    .filter(t=>t && t.name && !selected.has(String(t.name).toLowerCase()))
    .filter(t=>!q || String(t.name).toLowerCase().includes(q))
    .slice(0, 12);
}
function openTagSuggestions(ctx){
  renderTagSuggestions(ctx);
  const cfg=tagSuggestConfig(ctx);
  if(cfg && cfg.menu && cfg.menu.children.length) cfg.menu.classList.add('on');
}
function closeTagSuggestions(ctx){
  const cfg=tagSuggestConfig(ctx);
  if(cfg && cfg.menu) cfg.menu.classList.remove('on');
}
function renderTagSuggestions(ctx){
  const cfg=tagSuggestConfig(ctx);
  if(!cfg || !cfg.menu || !cfg.input) return;
  const tags=suggestedTags(ctx);
  cfg.menu.innerHTML = '';
  if(!tags.length){
    const empty=document.createElement('div');
    empty.className='tag-suggest-empty';
    empty.textContent = allTags.length ? '没有匹配标签' : '暂无已有标签';
    cfg.menu.appendChild(empty);
  }else{
    tags.forEach((t,i)=>{
      const btn=document.createElement('button');
      btn.type='button';
      btn.className='tag-suggest-item'+(i===0?' active':'');
      btn.addEventListener('pointerdown', e=>{
        e.preventDefault();
        e.stopPropagation();
        chooseSuggestedTag(ctx, ctx==='filter' && cfg.input.value.trim().startsWith('!') ? '!'+t.name : t.name);
      });
      const name=document.createElement('span');
      name.className='tag-suggest-name';
      name.textContent=t.name;
      const count=document.createElement('span');
      count.className='tag-suggest-count';
      count.textContent=t.count||0;
      btn.appendChild(name);
      btn.appendChild(count);
      cfg.menu.appendChild(btn);
    });
  }
  cfg.menu.classList.toggle('on', document.activeElement===cfg.input);
}
function chooseSuggestedTag(ctx,name){
  const cfg=tagSuggestConfig(ctx);
  cfg.add(name);
  if(cfg.input){ cfg.input.value=''; cfg.input.focus(); }
  renderTagSuggestions(ctx);
}
function firstSuggestedTagName(ctx){
  const tags=suggestedTags(ctx);
  if(!tags.length) return '';
  const cfg=tagSuggestConfig(ctx);
  return ctx==='filter' && cfg.input.value.trim().startsWith('!') ? '!'+tags[0].name : tags[0].name;
}
function handleTagInputKey(e,ctx){
  const cfg=tagSuggestConfig(ctx);
  if(e.key==='Enter'||e.key===','){
    e.preventDefault();
    const typed=normalizeTag(e.target.value);
    const tag=typed || firstSuggestedTagName(ctx);
    if(tag) cfg.add(tag);
    e.target.value='';
    renderTagSuggestions(ctx);
    return;
  }
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    const tag=firstSuggestedTagName(ctx);
    if(tag){ e.target.value=tag; renderTagSuggestions(ctx); }
  }
}
function mktag(name,count,on,excluded=false){
  const el = document.createElement('div');
  el.className = 'tag'+(on?' on':'')+(excluded?' exclude on':''); el.dataset.tag = name;
  el.innerHTML = name + (count!=null ? `<span class="tag-count">${count}</span>`:'');
  return el;
}
function syncTags(){
  document.querySelectorAll('.tag[data-tag]').forEach(el=>{
    const t = el.dataset.tag;
    const excluded = activeExcludeTags.includes(t);
    el.classList.toggle('exclude', excluded);
    if(t==='全部') el.classList.toggle('on', activeTags.length===0 && activeExcludeTags.length===0);
    else el.classList.toggle('on', activeTags.includes(t) || excluded);
  });
  const modeBtn=document.getElementById('tagModeBtn');
  if(modeBtn){
    modeBtn.classList.toggle('exclude', tagClickMode==='exclude');
    modeBtn.textContent = tagClickMode==='exclude' ? '排除' : '包含';
    modeBtn.title = tagClickMode==='exclude' ? '点击标签会加入排除筛选' : '点击标签会加入包含筛选';
  }
  renderSearchTags();
}
function uniqueTags(tags){
  const out=[];
  tags.forEach(raw=>{
    const tag=String(raw||'').trim().replace(/,/g,'');
    if(tag && !out.includes(tag)) out.push(tag);
  });
  return out;
}
function tagsFromUrl(){
  const params=new URLSearchParams(location.search);
  const tags=[];
  params.getAll('tag').forEach(t=>tags.push(t));
  const grouped=params.get('tags');
  if(grouped) grouped.split(',').forEach(t=>tags.push(t));
  return uniqueTags(tags);
}
function excludeTagsFromUrl(){
  const params=new URLSearchParams(location.search);
  const tags=[];
  params.getAll('exclude').forEach(t=>tags.push(t));
  const grouped=params.get('excludes');
  if(grouped) grouped.split(',').forEach(t=>tags.push(t));
  return uniqueTags(tags);
}
function updateFilterUrl(replace=false){
  const url=new URL(location.href);
  url.searchParams.delete('tag');
  url.searchParams.delete('tags');
  url.searchParams.delete('exclude');
  url.searchParams.delete('excludes');
  if(activeTags.length===1) url.searchParams.set('tag', activeTags[0]);
  else if(activeTags.length>1) url.searchParams.set('tags', activeTags.join(','));
  if(activeExcludeTags.length===1) url.searchParams.set('exclude', activeExcludeTags[0]);
  else if(activeExcludeTags.length>1) url.searchParams.set('excludes', activeExcludeTags.join(','));
  const next=url.pathname + url.search + url.hash;
  const cur=location.pathname + location.search + location.hash;
  if(next!==cur) history[replace?'replaceState':'pushState'](null, '', next);
}
function applyUrlFilters(){
  activeTags=tagsFromUrl();
  activeExcludeTags=excludeTagsFromUrl();
  activeExcludeTags=activeExcludeTags.filter(t=>!activeTags.includes(t));
  q='';
  const input=document.getElementById('searchInput');
  if(input) input.value='';
  const clearBtn=document.getElementById('clearBtn');
  if(clearBtn) clearBtn.style.display = activeTags.length || activeExcludeTags.length ? '' : 'none';
  syncTags();
}
function commitFilters(replace=false){
  activeTags=uniqueTags(activeTags);
  activeExcludeTags=uniqueTags(activeExcludeTags).filter(t=>!activeTags.includes(t));
  q='';
  const input=document.getElementById('searchInput');
  if(input) input.value='';
  const clearBtn=document.getElementById('clearBtn');
  if(clearBtn) clearBtn.style.display = activeTags.length || activeExcludeTags.length ? '' : 'none';
  syncTags();
  renderTagSuggestions('filter');
  updateFilterUrl(replace);
  loadImgs(true);
}
function renderSearchTags(){
  const box=document.getElementById('searchTags');
  if(!box) return;
  const includeHtml=activeTags.map((tag,i)=>
    `<span class="search-chip"><span class="search-chip-name">${esc(tag)}</span><button class="search-chip-x" onclick="removeSearchTag(${i})">✕</button></span>`
  ).join('');
  const excludeHtml=activeExcludeTags.map((tag,i)=>
    `<span class="search-chip exclude"><span class="search-chip-name">!${esc(tag)}</span><button class="search-chip-x" onclick="removeExcludeSearchTag(${i})">✕</button></span>`
  ).join('');
  box.innerHTML=includeHtml+excludeHtml;
  const input=document.getElementById('searchInput');
  if(input) input.placeholder = activeTags.length || activeExcludeTags.length ? '继续添加标签…' : '输入标签后回车…';
}
function addSearchTag(raw){
  const parsed=parseFilterTag(raw);
  const tag=parsed.tag;
  if(!tag) return;
  if(parsed.exclude){
    activeTags=activeTags.filter(x=>x!==tag);
    if(!activeExcludeTags.includes(tag)) activeExcludeTags.push(tag);
  }else{
    activeExcludeTags=activeExcludeTags.filter(x=>x!==tag);
    if(!activeTags.includes(tag)) activeTags.push(tag);
  }
  commitFilters();
}
function removeSearchTag(i){
  activeTags.splice(i,1);
  commitFilters();
}
function removeExcludeSearchTag(i){
  activeExcludeTags.splice(i,1);
  commitFilters();
}
function onSearchKey(e){
  if(e.key==='Enter'||e.key===','){
    e.preventDefault();
    const raw=e.target.value;
    const parsed=parseFilterTag(raw);
    addSearchTag(parsed.tag ? raw : firstSuggestedTagName('filter'));
    e.target.value='';
  }else if(e.key==='Backspace'&&e.target.value===''&&activeTags.length){
    activeTags.pop();
    commitFilters();
  }else if(e.key==='Backspace'&&e.target.value===''&&activeExcludeTags.length){
    activeExcludeTags.pop();
    commitFilters();
  }else if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    const tag=firstSuggestedTagName('filter');
    if(tag){ e.target.value=tag; renderTagSuggestions('filter'); }
  }
}
function toggleTag(name){
  if(tagClickMode==='exclude'){
    activeTags=activeTags.filter(x=>x!==name);
    activeExcludeTags.includes(name) ? (activeExcludeTags=activeExcludeTags.filter(x=>x!==name)) : activeExcludeTags.push(name);
  }else{
    activeExcludeTags=activeExcludeTags.filter(x=>x!==name);
    activeTags.includes(name) ? (activeTags=activeTags.filter(x=>x!==name)) : activeTags.push(name);
  }
  commitFilters();
}
function clearFilters(){
  activeTags=[]; activeExcludeTags=[];
  commitFilters();
}
function toggleTagClickMode(){
  tagClickMode = tagClickMode==='exclude' ? 'include' : 'exclude';
  syncTags();
}

/* ────────────────────────────────── GALLERY */
async function loadImgs(reset=false){
  if(loading && !reset) return;
  if(!reset && done) return;
  const seq = ++loadSeq;
  loading=true;
  if(reset){
    page=1;
    done=false;
    scrolledForMore=false;
    clearSelection();
    imgs=[];
    virtualPositions=[];
    renderedCards.clear();
    cancelAnimationFrame(virtualRAF);
    document.getElementById('gallery').innerHTML='';
    document.getElementById('emptyState').style.display='none';
    showSkels();
    if(window.scrollY>0){
      suppressScrollArm = true;
      window.scrollTo(0,0);
      setTimeout(()=>{ suppressScrollArm=false; }, 180);
    }
  }
  document.getElementById('spinner').classList.add('on');

  const currentPage = page;
  let url = `/api/images?page=${currentPage}&limit=${PG}`;
  if(q) url+=`&tag=${encodeURIComponent(q)}`;
  else if(activeTags.length===1) url+=`&tag=${encodeURIComponent(activeTags[0])}`;
  else if(activeTags.length>1) url+=`&tags=${encodeURIComponent(activeTags.join(','))}`;
  if(activeExcludeTags.length===1) url+=`&exclude=${encodeURIComponent(activeExcludeTags[0])}`;
  else if(activeExcludeTags.length>1) url+=`&excludes=${encodeURIComponent(activeExcludeTags.join(','))}`;

  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    if(seq!==loadSeq) return;
    total = d.total||0;
    if(reset) document.querySelectorAll('.skel').forEach(s=>s.remove());
    const batch = d.images||[];
    batch.forEach(img=>{ imgs.push(img); });
    done = imgs.length >= total || batch.length < PG;
    document.getElementById('emptyState').style.display = total===0 ? '' : 'none';
    const includeText = activeTags.length ? activeTags.join(', ') : q ? `"${q}"` : '';
    const excludeText = activeExcludeTags.length ? `排除 ${activeExcludeTags.join(', ')}` : '';
    const f = includeText || excludeText ? ` · ${[includeText, excludeText].filter(Boolean).join(' · ')}` : '';
    document.getElementById('barCount').innerHTML = `<b>${total}</b> 张图片${f}`;
    page = currentPage + 1;
  }catch(e){
    if(seq===loadSeq){
      if(reset) document.querySelectorAll('.skel').forEach(s=>s.remove());
      toast('加载失败','bad');
    }
  }finally{
    if(seq===loadSeq){
      document.getElementById('spinner').classList.remove('on');
      loading=false;
      scheduleGalleryLayout();
    }
  }
}
function showSkels(){
  const g = document.getElementById('gallery');
  const pattern = ['portrait','landscape','portrait','square','landscape','portrait','landscape','square','portrait','landscape'];
  Array.from({length: PG}, (_, i)=>pattern[i % pattern.length]).forEach(orientation=>{
    const s=document.createElement('div');
    s.className=`skel is-${orientation}`;
    s.dataset.orientation=orientation;
    g.appendChild(s);
  });
  scheduleGalleryLayout();
}
function getGalleryColumns(){
  const g = document.getElementById('gallery');
  const w = g ? g.clientWidth : window.innerWidth;
  if(w < 560) return 2;
  if(w < 840) return 3;
  if(w < 1120) return 4;
  return 5;
}
function getCardRatio(orientation){
  if(orientation==='landscape') return 4/3;
  if(orientation==='square') return 1;
  return 3/4;
}
function getImageOrientation(img){
  const w = Number(img.width) || 1;
  const h = Number(img.height) || 1;
  const ratio = w / h;
  if(ratio > 1.08) return 'landscape';
  if(ratio < .92) return 'portrait';
  return 'square';
}
function scheduleGalleryLayout(){
  cancelAnimationFrame(layoutRAF);
  layoutRAF = requestAnimationFrame(layoutGallery);
}
function layoutGallery(){
  const g = document.getElementById('gallery');
  if(!g) return;
  const styles = getComputedStyle(g);
  const cols = getGalleryColumns();
  const gap = parseFloat(styles.getPropertyValue('--gap')) || 10;
  const width = Math.max(1, Math.floor((g.clientWidth - gap * (cols - 1)) / cols));
  const colHeights = Array(cols).fill(0);
  g.style.setProperty('--cols', cols);

  const skels = document.querySelectorAll('#gallery .skel');
  if(skels.length){
    skels.forEach(el=>{
      const orientation = el.dataset.orientation || 'portrait';
      const ratio = getCardRatio(orientation);
      const height = Math.round(width / ratio);
      const minHeight = Math.min(...colHeights);
      const col = colHeights.indexOf(minHeight);
      const x = col * (width + gap);
      const y = colHeights[col];

      el.style.width = `${width}px`;
      el.style.height = `${height}px`;
      el.style.transform = `translate3d(${x}px, ${y}px, 0)`;
      colHeights[col] += height + gap;
    });

    const skeletonHeight = Math.max(0, Math.max(...colHeights) - gap);
    g.style.height = `${skeletonHeight}px`;
    return;
  }

  virtualPositions = imgs.map(img=>{
    const orientation = getImageOrientation(img);
    const ratio = getCardRatio(orientation);
    const height = Math.round(width / ratio);
    const minHeight = Math.min(...colHeights);
    const col = colHeights.indexOf(minHeight);
    const x = col * (width + gap);
    const y = colHeights[col];
    colHeights[col] += height + gap;

    return { id: Number(img.id), x, y, width, height, orientation };
  });

  const galleryHeight = Math.max(0, Math.max(...colHeights) - gap);
  g.style.height = `${galleryHeight}px`;
  updateVirtualCards();
}
function markImageLoaded(card, ok=true){
  card.classList.remove('loading');
  card.classList.toggle('loaded', ok);
  card.classList.toggle('error', !ok);
}
function scheduleVirtualCards(){
  cancelAnimationFrame(virtualRAF);
  virtualRAF = requestAnimationFrame(updateVirtualCards);
}
function getVisibleVirtualRange(){
  if(!virtualPositions.length) return {start:0,end:-1};
  const g = document.getElementById('gallery');
  const top = window.scrollY - g.offsetTop;
  const bottom = top + window.innerHeight;
  let first = -1;
  let last = -1;
  virtualPositions.forEach((p,i)=>{
    if(p.y + p.height < top || p.y > bottom) return;
    if(first === -1) first = i;
    last = i;
  });
  if(first === -1){
    first = virtualPositions.findIndex(p=>p.y >= top);
    if(first < 0) first = Math.max(0, virtualPositions.length - 1);
    last = first;
  }

  let start = Math.max(0, first - VIRTUAL_BUFFER);
  let end = Math.min(virtualPositions.length - 1, last + VIRTUAL_BUFFER);
  if(end - start + 1 > VIRTUAL_MAX){
    const mid = Math.floor((first + last) / 2);
    start = Math.max(0, mid - Math.floor(VIRTUAL_MAX / 2));
    end = Math.min(virtualPositions.length - 1, start + VIRTUAL_MAX - 1);
    start = Math.max(0, end - VIRTUAL_MAX + 1);
  }
  return {start,end};
}
function updateVirtualCards(){
  const g = document.getElementById('gallery');
  if(!g || document.querySelector('#gallery .skel')) return;
  const {start,end} = getVisibleVirtualRange();
  const keep = new Set();

  for(let i=start;i<=end;i++){
    const pos = virtualPositions[i];
    const img = imgs[i];
    if(!pos || !img) continue;
    const id = Number(img.id);
    keep.add(id);
    let card = renderedCards.get(id);
    if(!card){
      card = createCard(img);
      renderedCards.set(id, card);
      g.appendChild(card);
    }
    card.style.width = `${pos.width}px`;
    card.style.height = `${pos.height}px`;
    card.style.transform = `translate3d(${pos.x}px, ${pos.y}px, 0)`;
    card.dataset.orientation = pos.orientation;
  }

  renderedCards.forEach((card,id)=>{
    if(keep.has(id)) return;
    card.remove();
    renderedCards.delete(id);
  });
}
function createCard(img){
  const div = document.createElement('div');
  const orientation = getImageOrientation(img);
  div.className=`card loading is-${orientation}`;
  div.dataset.id=img.id;
  div.dataset.orientation=orientation;
  const src = img.is_gif ? img.orig_url : img.webp_url;
  const w = Math.max(1, Number(img.width) || 3);
  const h = Math.max(1, Number(img.height) || 4);
  const cardTitle = esc(String(img.title||'').trim());
  const webpFull = location.origin + img.webp_url;
  const origName = img.orig_url.split('/').pop();

  div.innerHTML = `
    ${img.is_gif ? '<div class="gif-chip">GIF</div>' : ''}
    <label class="card-select" title="选择图片" onclick="event.stopPropagation()" onmousedown="event.stopPropagation()">
      <input type="checkbox" onchange="toggleSelect(${img.id}, this.checked)">
      <span class="card-select-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
      </span>
    </label>
    <img alt="" decoding="async" width="${w}" height="${h}">
    <div class="card-strip">
      <div class="card-title">${cardTitle}</div>
      <div class="card-btns">
        <button class="card-action" title="复制链接" onclick="event.stopPropagation();copyUrl('${webpFull}',this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
        <button class="card-action" title="下载原图" onclick="event.stopPropagation();dlFile('${img.orig_url}','${origName}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
      </div>
    </div>`;
  const imageEl = div.querySelector('img');
  imageEl.addEventListener('load', ()=>{
    markImageLoaded(div, true);
  }, {once:true});
  imageEl.addEventListener('error', ()=>{
    markImageLoaded(div, false);
  }, {once:true});
  div.addEventListener('click', ()=>openLb(imgs.findIndex(x=>x.id===img.id)));
  imageEl.src = src;
  if(imageEl.decode){
    imageEl.decode().then(()=>markImageLoaded(div, true)).catch(()=>{});
  }
  if(imageEl.complete) markImageLoaded(div, imageEl.naturalWidth>0);
  setTimeout(()=>{
    if(imageEl.complete) markImageLoaded(div, imageEl.naturalWidth>0);
  }, 800);
  return div;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function linkify(text){
  const safe = esc(String(text||''));
  return safe.replace(/(https?:\/\/[^\s<>"')\]]+)/g, m=>{
    const trimmed = m.replace(/[.,;:!?，。；：！？]+$/,'');
    return `<a href="${trimmed}" target="_blank" rel="noopener noreferrer">${trimmed}</a>${m.slice(trimmed.length)}`;
  });
}
function jsString(s){ return JSON.stringify(String(s)); }
function filterTag(name){
  if(!activeTags.includes(name)){
    activeTags.push(name);
    commitFilters();
  }
}

/* ────────────────────────────────── SELECTION */
function imageById(id){
  return imgs.find(x=>String(x.id)===String(id));
}
function selectedImages(){
  return [...selectedIds].map(imageById).filter(Boolean);
}
function updateSelectionUI(){
  document.querySelectorAll('#gallery .card').forEach(card=>{
    const on = selectedIds.has(Number(card.dataset.id));
    card.classList.toggle('selected', on);
    const box = card.querySelector('.card-select input');
    if(box) box.checked = on;
  });
  const count = selectedIds.size;
  const actions = document.getElementById('bulkActions');
  const countEl = document.getElementById('bulkCount');
  if(actions) actions.classList.toggle('show', count>0);
  document.body.classList.toggle('bulk-actions-on', count>0);
  if(countEl) countEl.textContent = `已选 ${count}`;
}
function toggleSelect(id, checked){
  id = Number(id);
  if(checked) selectedIds.add(id);
  else selectedIds.delete(id);
  updateSelectionUI();
}
function clearSelection(){
  selectedIds.clear();
  updateSelectionUI();
}
function selectedWebpUrls(){
  return selectedImages().map(img=>location.origin + img.webp_url);
}
async function batchCopyUrls(){
  const urls = selectedWebpUrls();
  if(!urls.length){ toast('请先选择图片','bad'); return; }
  const text = urls.join('\n');
  const ok = await smartCopy(text);
  if(ok) toast(`已复制 ${urls.length} 个链接`);
  else prompt('复制链接：', text);
}
function batchDownloadImages(){
  const list = selectedImages();
  if(!list.length){ toast('请先选择图片','bad'); return; }
  list.forEach((img,i)=>{
    const name = img.orig_url.split('/').pop();
    setTimeout(()=>dlFile(img.orig_url, name), i*180);
  });
  toast(`开始下载 ${list.length} 张图片`);
}

/* ────────────────────────────────── COPY / DOWNLOAD */
async function copyUrl(url, btn){
  const ok = await smartCopy(url);
  if(ok){
    if(btn){ const o=btn.innerHTML; btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13"><polyline points="20 6 9 17 4 12"/></svg>'; setTimeout(()=>btn.innerHTML=o,1400); }
    toast('链接已复制');
  } else {
    prompt('复制链接：', url);
  }
}
async function smartCopy(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
  }
  try{
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.cssText='position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok=document.execCommand('copy'); document.body.removeChild(ta); return ok;
  }catch(e){}
  return false;
}
async function dlFile(url, fn){
  try{
    const blob = await fetch(url).then(r=>r.blob());
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fn||'image';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); document.body.removeChild(a); },1000);
  }catch(e){
    const a=document.createElement('a'); a.href=url; a.download=fn||'image';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }
}

/* ────────────────────────────────── INFINITE SCROLL */
function setupIO(){
  if(io) io.disconnect();
  const sentinel = document.getElementById('sentinel');
  io = new IntersectionObserver(es=>{
    if(es[0].isIntersecting && scrolledForMore && !loading && !done) loadImgs(false);
  },{ rootMargin:'0px 0px 120px 0px' });
  io.observe(sentinel);

  const armScrollLoading = ()=>{
    if(suppressScrollArm) return;
    scheduleVirtualCards();
    scrolledForMore = true;
    if(!loading && !done && sentinelIsNear()) loadImgs(false);
  };
  window.addEventListener('scroll', scheduleVirtualCards, {passive:true});
  window.addEventListener('scroll', armScrollLoading, {passive:true});
  window.addEventListener('wheel', armScrollLoading, {passive:true});
  window.addEventListener('touchmove', armScrollLoading, {passive:true});
  window.addEventListener('keydown', e=>{
    if(['ArrowDown','PageDown',' ','End'].includes(e.key)) armScrollLoading();
  });
}
function sentinelIsNear(){
  const s = document.getElementById('sentinel');
  if(!s) return false;
  return s.getBoundingClientRect().top <= window.innerHeight + 120;
}

/* ────────────────────────────────── LIGHTBOX */
function openLb(idx){ lbIdx=idx; renderLb(); document.getElementById('lb').classList.add('open'); document.getElementById('urlPanel').classList.remove('on'); }
function renderLb(){
  const img=imgs[lbIdx]; if(!img) return;
  document.getElementById('lbImg').src = img.is_gif ? img.orig_url : img.webp_url;
  lbW=location.origin+img.webp_url; lbO=location.origin+img.orig_url;
  lbFn=img.orig_url.split('/').pop();
  document.getElementById('urlWebp').value=lbW; document.getElementById('urlOrig').value=lbO;
  const tg=document.getElementById('lbTags');
  tg.innerHTML=(img.tags||[]).map(t=>`<span class="lb-tag">${esc(t)}</span>`).join('');
  const ti=document.getElementById('lbTitle');
  if(img.title && String(img.title).trim()){
    ti.textContent=String(img.title).trim();
    ti.style.display='';
  }else{
    ti.style.display='none';
  }
  const de=document.getElementById('lbDescription');
  if(img.description && String(img.description).trim()){
    de.innerHTML=linkify(String(img.description).trim());
    de.style.display='';
  }else{
    de.style.display='none';
  }
  ['lbCopyW','lbCopyO'].forEach(id=>document.getElementById(id).classList.remove('copied'));
}
async function lbCopy(type){
  const url=type==='webp'?lbW:lbO;
  const btnId=type==='webp'?'lbCopyW':'lbCopyO';
  const btn=document.getElementById(btnId);
  const ok=await smartCopy(url);
  if(ok){
    const orig=btn.innerHTML; btn.classList.add('copied'); btn.textContent='✓ 已复制';
    toast('链接已复制'); setTimeout(()=>{ btn.innerHTML=orig; btn.classList.remove('copied'); },1800);
  } else {
    document.getElementById('urlPanel').classList.add('on');
    const inp=type==='webp'?'urlWebp':'urlOrig';
    document.getElementById(inp).focus(); document.getElementById(inp).select();
    toast('请手动复制链接');
  }
}
function manualCopy(id,btn){
  const inp=document.getElementById(id); inp.select(); inp.setSelectionRange(0,9999);
  if(document.execCommand('copy')){ const o=btn.textContent; btn.textContent='✓'; setTimeout(()=>btn.textContent=o,1400); toast('链接已复制'); }
}
function triggerDl(){ dlFile(lbO.replace(location.origin,''), lbFn); }
function lbNav(dir){
  lbIdx=Math.max(0,Math.min(imgs.length-1,lbIdx+dir));
  if(lbIdx>=imgs.length-4 && !done) loadImgs(false);
  document.getElementById('urlPanel').classList.remove('on'); renderLb();
}
function closeLb(){ document.getElementById('lb').classList.remove('open'); }
function lbBgClick(e){
  const el=e.target;
  if(el===document.getElementById('lb') || el.classList.contains('lb-stage')) closeLb();
}
document.addEventListener('keydown',e=>{
  const lb=document.getElementById('lb');
  if(lb.classList.contains('open')){
    if(e.key==='ArrowRight'||e.key==='ArrowDown') lbNav(1);
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp') lbNav(-1);
    else if(e.key==='Escape'){ document.getElementById('urlPanel').classList.remove('on'); closeLb(); }
    return;
  }
  if(e.key==='Escape') closeApiHelp();
});

/* ────────────────────────────────── API HELP */
function openApiHelp(){
  const origin=location.origin;
  document.getElementById('apiUrl1').textContent = origin + '/api/random';
  document.getElementById('apiImg').textContent = '<img src="' + origin + '/api/random">';
  document.getElementById('apiUrl2').textContent = origin + '/api/random?tag=nature';
  document.getElementById('apiUrl3').textContent = origin + '/api/random?tags=nature,sunset&format=json&count=5';
  document.getElementById('apiHelpBackdrop').classList.add('open');
}
function closeApiHelp(){ document.getElementById('apiHelpBackdrop').classList.remove('open'); }

/* ────────────────────────────────── TOAST */
let _t;
function toast(msg, type='ok'){
  clearTimeout(_t); const el=document.getElementById('toast');
  el.textContent=msg; el.className=`toast ${type} on`;
  _t=setTimeout(()=>el.className=`toast ${type}`,2600);
}
function debounce(fn,ms){ let t; return(...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }

init();
</script>
